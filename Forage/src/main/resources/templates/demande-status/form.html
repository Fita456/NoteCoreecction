<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Ajouter un Statut</title>
</head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-plus-circle"></i> Ajouter un Statut de Demande</h2>
        <a th:href="@{/demande-status}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Retour
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <i class="bi bi-clock-history"></i> Nouveau Statut
                </div>
                <div class="card-body">
                    <form th:action="@{/demande-status/save}" method="post">
                        
                        <input type="hidden" name="demandeStatusId" value="0">
                        
                        <!-- Demande -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                <i class="bi bi-file-text"></i> Demande *
                            </label>
                            <select name="demandeId" class="form-select" required
                                    onchange="afficherInfoDemande(this)">
                                <option value="">-- Sélectionner une demande --</option>
                                <option th:each="d : ${demandes}"
                                        th:value="${d.id}"
                                        th:text="'#' + ${d.id} + ' - ' + ${d.client.nom} + ' (' + ${d.lieu} + ')'"
                                        th:selected="${selectedDemandeId != null && selectedDemandeId == d.id}"
                                        th:data-client="${d.client.nom}"
                                        th:data-contact="${d.client.contact}"
                                        th:data-lieu="${d.lieu}"
                                        th:data-district="${d.district}"
                                        th:data-statut="${d.dernierStatusLibelle}">
                                </option>
                            </select>
                        </div>
                        
                        <!-- Info demande -->
                        <div id="infoDemandeBox" class="alert alert-info mb-3" 
                             style="display: none;">
                            <div class="row">
                                <div class="col-6">
                                    <small class="text-muted">Client</small><br>
                                    <strong id="infoClient">-</strong>
                                </div>
                                <div class="col-6">
                                    <small class="text-muted">Contact</small><br>
                                    <strong id="infoContact">-</strong>
                                </div>
                            </div>
                            <hr class="my-2">
                            <div class="row">
                                <div class="col-6">
                                    <small class="text-muted">Lieu</small><br>
                                    <strong id="infoLieu">-</strong>
                                </div>
                                <div class="col-6">
                                    <small class="text-muted">District</small><br>
                                    <strong id="infoDistrict">-</strong>
                                </div>
                            </div>
                            <hr class="my-2">
                            <small class="text-muted">Statut actuel</small><br>
                            <span class="badge bg-info" id="infoStatut">-</span>
                        </div>
                        
                        <!-- Status -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                <i class="bi bi-flag"></i> Nouveau Statut *
                            </label>
                            <select name="statusId" class="form-select" required>
                                <option value="">-- Sélectionner un statut --</option>
                                <option th:each="s : ${statuses}"
                                        th:value="${s.id}"
                                        th:text="${s.libelle}">
                                </option>
                            </select>
                        </div>
                        
                        <!-- Commentaire -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">
                                <i class="bi bi-chat-text"></i> Commentaire
                            </label>
                            <textarea name="commentaire" class="form-control" rows="4"
                                      placeholder="Ajouter un commentaire (optionnel)..."></textarea>
                        </div>
                        
                        <!-- Boutons -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg"></i> Enregistrer
                            </button>
                            <a th:href="@{/demande-status}" class="btn btn-secondary">
                                <i class="bi bi-x"></i> Annuler
                            </a>
                        </div>
                        
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    function afficherInfoDemande(select) {
        const box = document.getElementById('infoDemandeBox');
        
        if (!select.value) {
            box.style.display = 'none';
            return;
        }
        
        const option = select.options[select.selectedIndex];
        
        document.getElementById('infoClient').textContent   = option.dataset.client   || '-';
        document.getElementById('infoContact').textContent  = option.dataset.contact  || '-';
        document.getElementById('infoLieu').textContent     = option.dataset.lieu     || '-';
        document.getElementById('infoDistrict').textContent = option.dataset.district || '-';
        document.getElementById('infoStatut').textContent   = option.dataset.statut   || '-';
        
        box.style.display = 'block';
    }
    
    // Si une demande est pré-sélectionnée
    window.addEventListener('DOMContentLoaded', function() {
        const select = document.querySelector('select[name="demandeId"]');
        if (select && select.value) {
            afficherInfoDemande(select);
        }
    });
</script>
</body>
</html>
